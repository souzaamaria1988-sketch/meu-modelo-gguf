name: Treinar Modelo e Exportar GGUF

on:
  workflow_dispatch:

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers peft accelerate datasets

      - name: Clonar llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          pip install -r requirements.txt

      - name: Treinar e converter para GGUF
        run: |
          python - <<'EOF'
          import json, torch, subprocess
          from datasets import Dataset
          from transformers import AutoModelForCausalLM, AutoTokenizer, TrainingArguments, Trainer, DataCollatorForLanguageModeling
          from peft import LoraConfig, get_peft_model

          BASE = "Qwen/Qwen2.5-0.5B-Instruct"

          tok = AutoTokenizer.from_pretrained(BASE, trust_remote_code=True)
          if tok.pad_token is None:
              tok.pad_token = tok.eos_token

          model = AutoModelForCausalLM.from_pretrained(
              BASE, torch_dtype=torch.float32,
              low_cpu_mem_usage=True, trust_remote_code=True)
          model = get_peft_model(model, LoraConfig(
              r=8, lora_alpha=16,
              target_modules=["q_proj","k_proj","v_proj","o_proj"],
              lora_dropout=0.0, bias="none", task_type="CAUSAL_LM"))

          with open("train.jsonl", encoding="utf-8") as f:
              dados = [json.loads(l) for l in f if l.strip()]

          ds = Dataset.from_list(dados)

          # --- CORREÇÃO: remove todas as colunas extras (domain, etc.) ---
          colunas_extras = [c for c in ds.column_names if c != "messages"]
          if colunas_extras:
              print("Removendo colunas extras:", colunas_extras)
              ds = ds.remove_columns(colunas_extras)

          # Aplica template de chat
          ds = ds.map(lambda ex: {"text": tok.apply_chat_template(ex["messages"], tokenize=False)})

          # Tokeniza e remove 'messages'/'text' finais
          ds = ds.map(
              lambda e: tok(e["text"], truncation=True, max_length=256, padding="max_length"),
              batched=True,
              remove_columns=["messages", "text"])
          ds = ds.train_test_split(test_size=0.1)

          args = TrainingArguments(
              output_dir="out", num_train_epochs=1,
              per_device_train_batch_size=1,
              gradient_accumulation_steps=4,
              learning_rate=2e-4, logging_steps=10,
              save_strategy="no", report_to="none",
              remove_unused_columns=False)

          Trainer(model=model, args=args,
                  train_dataset=ds["train"], eval_dataset=ds["test"],
                  data_collator=DataCollatorForLanguageModeling(tok, mlm=False)).train()

          model.save_pretrained("lora")
          tok.save_pretrained("lora")

          subprocess.run(["python","llama.cpp/convert_lora_to_gguf.py",
                          "--base",BASE,"lora",
                          "--outfile","modelo_final.gguf",
                          "--outtype","q8_0"], check=True)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: modelo-gguf
          path: modelo_final.gguf